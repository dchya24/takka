[package]
name = "takka-runtime"
version = "0.1.0"
edition = "2021"
description = "Headless JSON Lines runtime for takka-core"
authors = ["devchya"]
license = "MIT"

[[bin]]
name = "takka-runtime"
path = "src/main.rs"

[dependencies]
takka-core = { path = "../takka-core" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# ACP (Fase 4) — typed wire schema for the Agent Client Protocol v1. Types only:
# the framing loop lives in src/acp.rs (see the Fase 4 design spec).
agent-client-protocol-schema = { version = "1.16.0", default-features = false }
