[package]
name = "takka-eval"
version = "0.1.0"
edition = "2021"
description = "Eval harness for the takka agent loop (replay and live lanes)"
authors = ["devchya"]
license = "MIT"
publish = false

[[bin]]
name = "takka-eval"
path = "src/main.rs"

[dependencies]
takka-core = { path = "../takka-core" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.0", features = ["rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tempfile = "3"
