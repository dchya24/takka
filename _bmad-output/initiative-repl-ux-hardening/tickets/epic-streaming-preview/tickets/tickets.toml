title = "Live preview of streamed text through the painter"
description = "The thinnest path through every layer the epic touches: on each renderer tick the pending block_text accumulates as whole lines and prints above the status line via the painter's erase-print-repaint cycle; a run with no streamed chunks falls back to today's render once, at the end."
