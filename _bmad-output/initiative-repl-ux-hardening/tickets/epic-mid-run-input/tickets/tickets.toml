title = "TUI mid-run input (both modes)"
description = "The TUI un-gates text input while `is_loading`: typed text routes through the same client contract (steer or local queue per `/queue`), lands in the message log, and the shared client-side drain depth guard takes effect here too."
verify = "A scripted run in the TUI accepts typed text in both queue modes; the message log shows the queueing/steering and the hand-over lands in the context like the inline path."
covers = ["R1"]
after = [1]
hitl = false
risk = "medium"

