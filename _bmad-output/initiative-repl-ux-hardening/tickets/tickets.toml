covers = ["R1"]
after = [{ epic = 1, needs = "the live-run rendering contract settled in the single-writer status painter and gate" }]

[[epic]]
id = 3
slug = "epic-tui-completions"
title = "TUI completion parity"
description = "The TUI lists and accepts slash-command and file-path completions like the inline REPL does."
covers = ["R3"]
after = [{ epic = 2, needs = "the TUI key dispatcher changes settled (mid-run input handling)" }]
