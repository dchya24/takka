[[epic]]
id = 1
slug = "epic-streaming-preview"
title = "Live streaming reply"
description = "An in-flight streamed answer is readable progressively in the inline REPL, ending in the existing final markdown render, with clean scrollback on finish and on mid-stream cancel; its closing stories fix the live-run rendering contract (painter + gate) that epic 2 builds on."
covers = ["R2"]

[[epic]]
id = 2
slug = "epic-mid-run-input"
title = "Talk to the agent mid-run"
